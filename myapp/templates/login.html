<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - 星辰协同平台</title>
  <link rel="stylesheet" href="/static/css/adminlte.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css" crossorigin="anonymous" />
  <style>
    :root{--brand:#1a73e8;--brand-light:#4a90d9;--brand-soft:#e8f0fe;}
    *{box-sizing:border-box}
    body{
      background:linear-gradient(135deg,#e8f0fe 0%,#f0f6ff 50%,#fafcff 100%);
      min-height:100vh;font-family:'Source Sans 3',system-ui,sans-serif;
      display:flex;align-items:center;justify-content:center;margin:0;padding:20px
    }
    .auth-wrap{width:100%;max-width:1060px;margin:0 auto}
    .auth-card{
      display:grid;grid-template-columns:1.1fr .9fr;min-height:580px;
      background:#fff;border-radius:20px;overflow:hidden;
      box-shadow:0 20px 60px rgba(26,115,232,.1),0 8px 20px rgba(0,0,0,.04);
      animation:fadeUp .5s ease
    }
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    .hero-panel{
      background:linear-gradient(160deg,#1a73e8,#4a90d9);
      color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;
      position:relative;overflow:hidden
    }
    .hero-panel::before{
      content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;
      border-radius:50%;background:rgba(255,255,255,.06)
    }
    .hero-panel::after{
      content:'';position:absolute;bottom:-40px;left:-40px;width:160px;height:160px;
      border-radius:50%;background:rgba(255,255,255,.04)
    }
    .hero-badge{
      display:inline-flex;align-items:center;gap:6px;
      background:rgba(255,255,255,.15);padding:6px 14px;border-radius:999px;
      font-size:.8rem;font-weight:500;backdrop-filter:blur(4px)
    }
    .hero-title{font-size:2rem;font-weight:800;line-height:1.2;margin-top:24px}
    .hero-desc{font-size:.95rem;opacity:.8;margin-top:12px;line-height:1.6}
    .hero-features{display:flex;flex-direction:column;gap:12px;margin-top:24px}
    .hero-feat{display:flex;align-items:center;gap:10px;font-size:.88rem;opacity:.85}
    .hero-feat i{font-size:1.1rem}
    .hero-illustration{font-size:4rem;opacity:.15;position:absolute;bottom:32px;right:32px}
    .form-panel{padding:48px;display:flex;flex-direction:column;justify-content:center}
    .form-header{margin-bottom:28px}
    .form-header h3{font-size:1.5rem;font-weight:700;margin:0 0 4px}
    .form-header p{color:#64748b;margin:0;font-size:.9rem}
    .form-group{margin-bottom:18px}
    .form-group label{display:block;font-size:.82rem;font-weight:500;color:#475569;margin-bottom:6px}
    .input-wrap{
      position:relative;display:flex;align-items:center;
      border:1.5px solid #e2e8f0;border-radius:10px;transition:all .2s;
      background:#f8fafc
    }
    .input-wrap:focus-within{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(26,115,232,.1)}
    .input-wrap .input-icon{
      padding:0 0 0 14px;color:#94a3b8;font-size:1rem;
      display:flex;align-items:center
    }
    .input-wrap input{
      flex:1;border:none;background:transparent;padding:11px 14px;
      font-size:.92rem;color:#1e293b;outline:none;font-family:inherit
    }
    .input-wrap input::placeholder{color:#94a3b8}
    .input-wrap .toggle-pw{
      padding:0 14px 0 0;color:#94a3b8;cursor:pointer;font-size:.9rem;
      display:none;align-items:center
    }
    .input-wrap .toggle-pw.show{display:flex}
    .input-wrap .toggle-pw:hover{color:var(--muted)}
    .form-options{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:.85rem}
    .form-options label{display:flex;align-items:center;gap:6px;color:#475569;cursor:pointer}
    .form-options input[type="checkbox"]{width:16px;height:16px;accent-color:var(--brand);border-radius:4px}
    .auth-btn{
      width:100%;padding:12px;border:none;border-radius:10px;
      background:var(--brand);color:#fff;font-size:.95rem;font-weight:600;
      cursor:pointer;transition:all .2s;display:flex;align-items:center;
      justify-content:center;gap:8px;font-family:inherit
    }
    .auth-btn:hover{background:#1557b0;transform:translateY(-1px);box-shadow:0 4px 12px rgba(26,115,232,.3)}
    .auth-btn:active{transform:translateY(0)}
    .auth-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .auth-btn .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none}
    .auth-btn.loading .spinner{display:inline-block}
    .auth-btn.loading .btn-text{opacity:.7}
    @keyframes spin{to{transform:rotate(360deg)}}
    .error-msg{padding:10px 14px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;color:#dc2626;font-size:.85rem;margin-top:12px;display:none;animation:fadeIn .2s}
    .error-msg.show{display:block}
    .error-msg i{margin-right:6px}
    .auth-footer{text-align:center;margin-top:20px;font-size:.88rem;color:#64748b}
    .auth-footer a{color:var(--brand);text-decoration:none;font-weight:600}
    .auth-footer a:hover{text-decoration:underline}
    .success-msg{padding:10px 14px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;color:#16a34a;font-size:.85rem;display:none;animation:fadeIn .2s}
    .success-msg.show{display:block}
    @media(max-width:768px){
      .auth-card{grid-template-columns:1fr;min-height:auto}
      .hero-panel{padding:32px;min-height:200px}
      .hero-illustration{display:none}
      .form-panel{padding:32px}
    }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="hero-panel">
        <div>
          <span class="hero-badge"><i class="bi bi-lightning-fill"></i> 星辰协同平台</span>
          <h1 class="hero-title">欢迎回来</h1>
          <p class="hero-desc">即时通讯、协同工作。<br>与团队高效沟通。</p>
          <div class="hero-features">
            <div class="hero-feat"><i class="bi bi-chat-dots"></i> 即时协同群聊与私聊</div>
            <div class="hero-feat"><i class="bi bi-robot"></i> AI 智能助手</div>
            <div class="hero-feat"><i class="bi bi-bell"></i> 实时通知推送</div>
          </div>
        </div>
        <div class="hero-illustration"><i class="bi bi-chat-square-dots-fill"></i></div>
      </div>
      <div class="form-panel">
        <div class="form-header">
          <h3>登录账号</h3>
          <p>使用账号或手机号登录</p>
        </div>
        <div class="form-group">
          <label>用户名 / 手机号</label>
          <div class="input-wrap">
            <span class="input-icon"><i class="bi bi-person"></i></span>
            <input id="username" type="text" placeholder="输入用户名或手机号" autocomplete="username" autofocus>
          </div>
        </div>
        <div class="form-group">
          <label>密码</label>
          <div class="input-wrap">
            <span class="input-icon"><i class="bi bi-lock"></i></span>
            <input id="password" type="password" placeholder="输入密码" autocomplete="current-password">
            <span class="toggle-pw" id="togglePw" onclick="togglePassword()"><i class="bi bi-eye"></i></span>
          </div>
        </div>
        <div class="form-options">
          <label><input type="checkbox" id="rememberMe"> 记住我</label>
        </div>
        <button class="auth-btn" id="loginBtn" onclick="login()">
          <span class="spinner"></span>
          <span class="btn-text">登录</span>
        </button>
        <div class="error-msg" id="msg"><i class="bi bi-exclamation-circle"></i><span></span></div>
        <div class="auth-footer">
          没有账号？<a href="/auth/register/">注册新账号</a>
        </div>
      </div>
    </div>
  </div>
<script>
function togglePassword(){
  const pw = document.getElementById('password');
  const icon = document.getElementById('togglePw').querySelector('i');
  if(pw.type === 'password'){ pw.type = 'text'; icon.className = 'bi bi-eye-slash'; }
  else { pw.type = 'password'; icon.className = 'bi bi-eye'; }
}
document.getElementById('togglePw').style.display = 'flex';
document.getElementById('password').addEventListener('input', function(){
  document.getElementById('togglePw').style.display = this.value ? 'flex' : '';
});

function showError(msg){
  const el = document.getElementById('msg');
  el.querySelector('span').textContent = msg;
  el.classList.add('show');
}
function clearError(){
  document.getElementById('msg').classList.remove('show');
}

document.getElementById('username').addEventListener('input', clearError);
document.getElementById('password').addEventListener('input', clearError);

async function login(){
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  clearError();

  if(!username){ showError('请输入用户名或手机号'); document.getElementById('username').focus(); return; }
  if(!password){ showError('请输入密码'); document.getElementById('password').focus(); return; }

  btn.classList.add('loading');
  btn.disabled = true;
  try {
    const res = await fetch('/api/auth/login/', {
      method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
      body: JSON.stringify({username, password, remember_me: document.getElementById('rememberMe').checked})
    });
    const data = await res.json();
    if(!res.ok){ showError(data.detail || '登录失败'); btn.classList.remove('loading'); btn.disabled = false; return; }
    location.href = '/dashboard/';
  } catch(e){
    showError('网络错误，请重试');
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}

// Enter key submit
document.addEventListener('keydown', (e) => {
  if(e.key === 'Enter') login();
});
</script>
</body>
</html>
