{% extends 'base.html' %}
{% load static %}
{% block title %}好友管理 - 星辰协同平台{% endblock %}
{% block page_title %}好友管理{% endblock %}

{% block content %}
<div class="app-content-header">
  <div class="container-fluid">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <div class="muted" style="font-size:.88rem">管理好友与好友申请</div>
    </div>
  </div>
</div>
<div class="app-content page-content">
<div class="container-fluid" style="max-width:800px">

  <!-- Tabs -->
  <ul class="nav nav-tabs border-0 mb-3" id="friendTabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="friendsTab" data-bs-toggle="tab" data-bs-target="#friendsPanel" type="button">
        <i class="bi bi-people me-1"></i>好友 <span class="badge rounded-pill text-bg-light" id="friendCount">0</span>
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="pendingTab" data-bs-toggle="tab" data-bs-target="#pendingPanel" type="button">
        <i class="bi bi-person-plus me-1"></i>申请 <span class="badge rounded-pill text-bg-danger" id="pendingCount">0</span>
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="searchTab" data-bs-toggle="tab" data-bs-target="#searchPanel" type="button">
        <i class="bi bi-search me-1"></i>搜索用户
      </button>
    </li>
  </ul>

  <div class="tab-content">
    <!-- Friends List -->
    <div class="tab-pane fade show active" id="friendsPanel">
      <div class="card" style="border-radius:12px">
        <div class="card-body p-0" id="friendsList">
          <div class="empty-state py-4"><i class="bi bi-people"></i><p>暂无好友</p></div>
        </div>
      </div>
    </div>

    <!-- Pending Requests -->
    <div class="tab-pane fade" id="pendingPanel">
      <div class="card mb-3" style="border-radius:12px">
        <div class="card-header bg-transparent"><strong><i class="bi bi-inbox me-1"></i>收到的申请</strong></div>
        <div class="card-body p-0" id="incomingRequests">
          <div class="empty-state py-3"><i class="bi bi-inbox"></i><p>暂无收到的申请</p></div>
        </div>
      </div>
      <div class="card" style="border-radius:12px">
        <div class="card-header bg-transparent"><strong><i class="bi bi-send me-1"></i>已发送的申请</strong></div>
        <div class="card-body p-0" id="sentRequests">
          <div class="empty-state py-3"><i class="bi bi-send"></i><p>暂无已发送的申请</p></div>
        </div>
      </div>
    </div>

    <!-- Search Users -->
    <div class="tab-pane fade" id="searchPanel">
      <div class="card" style="border-radius:12px">
        <div class="card-body">
          <div class="input-group mb-3" style="border-radius:10px;overflow:hidden">
            <input class="form-control" id="searchUserInput" placeholder="输入用户名搜索" style="border:none;padding:10px 14px">
            <button class="btn btn-primary" id="searchUserBtn"><i class="bi bi-search"></i></button>
          </div>
          <div id="searchResults"></div>
        </div>
      </div>
    </div>
  </div>

</div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
let currentUser = null;

async function loadFriends(){
  try {
    const r = await fetch('/api/friends/', {credentials:'include'});
    const data = await r.json();
    const friends = data.friends || [];
    document.getElementById('friendCount').textContent = friends.length;
    const container = document.getElementById('friendsList');
    if(!friends.length){
      container.innerHTML = '<div class="empty-state py-4"><i class="bi bi-people"></i><p>暂无好友</p></div>';
      return;
    }
    container.innerHTML = '';
    friends.forEach(f => {
      const d = document.createElement('div');
      d.className = 'd-flex align-items-center gap-3 px-3 py-3 border-bottom';
      d.style.transition = 'background .15s';
      d.innerHTML = `
        <img src="${f.avatar_url || '/static/avater.jpeg'}" class="avatar" onerror="this.src='/static/avater.jpeg'">
        <div style="flex:1;min-width:0">
          <div class="fw-medium">${f.display_name || f.username}</div>
          <div class="muted small">${f.organization || ''}</div>
        </div>
        <span class="status-dot ${f.online_status || 'offline'}" title="${f.online_status === 'online' ? '在线' : f.online_status === 'away' ? '忙碌' : f.online_status === 'dnd' ? '请勿打扰' : '离线'}"></span>
        <button class="btn btn-sm btn-outline-primary chat-friend-btn" data-id="${f.id}" style="border-radius:999px"><i class="bi bi-chat-dots"></i></button>
      `;
      container.appendChild(d);
    });
    container.querySelectorAll('.chat-friend-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const rid = parseInt(btn.dataset.id);
        const r = await fetch('/api/conversations/create/', {method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify({type:'direct', participant_ids:[rid]})});
        const data = await r.json();
        if(data.id) location.href = '/chat/?conv='+data.id;
      });
    });
  } catch(e){ console.error(e); }
}

async function loadPendingRequests(){
  try {
    const r = await fetch('/api/friends/pending/', {credentials:'include'});
    const data = await r.json();
    const incoming = data.incoming || [];
    const sent = data.sent || [];
    document.getElementById('pendingCount').textContent = incoming.length;

    // Incoming
    const incomingContainer = document.getElementById('incomingRequests');
    if(!incoming.length){
      incomingContainer.innerHTML = '<div class="empty-state py-3"><i class="bi bi-inbox"></i><p>暂无收到的申请</p></div>';
    } else {
      incomingContainer.innerHTML = '';
      incoming.forEach(fr => {
        const d = document.createElement('div');
        d.className = 'd-flex align-items-center gap-3 px-3 py-3 border-bottom';
        d.innerHTML = `
          <img src="${fr.avatar_url || '/static/avater.jpeg'}" class="avatar" onerror="this.src='/static/avater.jpeg'">
          <div style="flex:1;min-width:0">
            <div class="fw-medium">${fr.display_name || fr.sender}</div>
            <div class="muted small">${new Date(fr.created_at).toLocaleString('zh-CN')}</div>
          </div>
          <button class="btn btn-sm btn-success accept-request-btn" data-id="${fr.id}" style="border-radius:999px"><i class="bi bi-check-lg"></i> 接受</button>
          <button class="btn btn-sm btn-outline-secondary reject-request-btn" data-id="${fr.id}" style="border-radius:999px"><i class="bi bi-x"></i></button>
        `;
        incomingContainer.appendChild(d);
      });
      incomingContainer.querySelectorAll('.accept-request-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          await fetch('/api/friends/handle/', {method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify({request_id: parseInt(btn.dataset.id), action: 'accept'})});
          showToast('已接受好友申请', 'success');
          loadPendingRequests();
          loadFriends();
        });
      });
      incomingContainer.querySelectorAll('.reject-request-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          await fetch('/api/friends/handle/', {method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify({request_id: parseInt(btn.dataset.id), action: 'reject'})});
          showToast('已拒绝好友申请');
          loadPendingRequests();
        });
      });
    }

    // Sent
    const sentContainer = document.getElementById('sentRequests');
    if(!sent.length){
      sentContainer.innerHTML = '<div class="empty-state py-3"><i class="bi bi-send"></i><p>暂无已发送的申请</p></div>';
    } else {
      sentContainer.innerHTML = '';
      sent.forEach(fr => {
        const d = document.createElement('div');
        d.className = 'd-flex align-items-center gap-3 px-3 py-3 border-bottom';
        d.innerHTML = `
          <img src="${fr.avatar_url || '/static/avater.jpeg'}" class="avatar" onerror="this.src='/static/avater.jpeg'">
          <div style="flex:1;min-width:0">
            <div class="fw-medium">${fr.display_name || fr.receiver}</div>
            <div class="muted small">${new Date(fr.created_at).toLocaleString('zh-CN')}</div>
          </div>
          <span class="badge rounded-pill text-bg-warning">等待中</span>
        `;
        sentContainer.appendChild(d);
      });
    }
  } catch(e){ console.error(e); }
}

async function searchUsers(){
  const q = document.getElementById('searchUserInput').value.trim();
  if(!q || q.length < 1) return;
  try {
    const r = await fetch(`/api/users/search/?q=${encodeURIComponent(q)}`, {credentials:'include'});
    const data = await r.json();
    const users = data.users || [];
    const container = document.getElementById('searchResults');
    if(!users.length){
      container.innerHTML = '<div class="empty-state py-3"><i class="bi bi-search"></i><p>未找到用户</p></div>';
      return;
    }
    container.innerHTML = '';
    users.forEach(u => {
      const d = document.createElement('div');
      d.className = 'd-flex align-items-center gap-3 px-3 py-3 border-bottom';
      d.innerHTML = `
        <img src="${u.avatar_url || '/static/avater.jpeg'}" class="avatar" onerror="this.src='/static/avater.jpeg'">
        <div style="flex:1;min-width:0">
          <div class="fw-medium">${u.display_name || u.username}</div>
          <div class="muted small">${u.organization || ''}</div>
        </div>
        <button class="btn btn-sm btn-outline-primary add-friend-btn" data-id="${u.id}" style="border-radius:999px"><i class="bi bi-person-plus"></i> 加好友</button>
      `;
      container.appendChild(d);
    });
    container.querySelectorAll('.add-friend-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const r = await fetch('/api/friends/request/', {method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify({receiver_id: parseInt(btn.dataset.id)})});
        const data = await r.json();
        if(r.ok){
          showToast(data.detail || '好友申请已发送', 'success');
          btn.disabled = true;
          btn.textContent = '已发送';
          btn.className = 'btn btn-sm btn-outline-secondary';
        } else {
          showToast(data.detail || '操作失败', 'danger');
        }
      });
    });
  } catch(e){ console.error(e); }
}

document.addEventListener('DOMContentLoaded', () => {
  loadFriends();
  loadPendingRequests();

  document.getElementById('searchUserBtn').addEventListener('click', searchUsers);
  document.getElementById('searchUserInput').addEventListener('keydown', e => {
    if(e.key === 'Enter') searchUsers();
  });
});
</script>
{% endblock %}
