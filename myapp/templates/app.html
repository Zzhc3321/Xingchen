<!doctype html>
<html lang="zh-Hans">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>事件协同群聊工具</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#007bff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />
  <link rel="preload" href="/static/css/adminlte.css" as="style" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css" crossorigin="anonymous" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="/static/css/adminlte.css" />
  <style>
    :root{--brand:#0d6efd;--brand-soft:#eaf2ff;--line:#e9eef5;--soft:#f8fbff;--ink:#1f2937;--muted:#6b7280;}
    body{font-family:'Source Sans 3',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f3f7fb;color:var(--ink)}
    .app-main{min-height:calc(100vh - 56px - 56px)}
    .bg-body-tertiary{background:#f3f7fb !important}
    .card{border:1px solid var(--line);box-shadow:0 10px 30px rgba(15,23,42,.04);border-radius:1rem}
    .card-header{background:#fff;border-bottom:1px solid var(--line)}
    .panel-title{font-weight:700;color:#0f172a}
    .muted{color:var(--muted)}
    .round{border-radius:1rem}
    .btn-primary{background:var(--brand);border-color:var(--brand)}
    .btn-outline-primary{color:var(--brand);border-color:rgba(13,110,253,.25)}
    .btn-outline-primary:hover{background:var(--brand);border-color:var(--brand)}
    .sidebar-menu .nav-link.active{background:var(--brand-soft);color:var(--brand);border-radius:.75rem}
    .sidebar-menu .nav-link{border-radius:.75rem}
    .small-box.soft{background:linear-gradient(135deg,#fff, #f7fbff);border:1px solid var(--line);border-radius:1rem;box-shadow:0 8px 20px rgba(13,110,253,.05)}
    .soft-pill{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .65rem;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-size:.8rem}
    .event-item,.chat-item,.friend-item,.pending-item{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:1rem;padding:14px;margin-bottom:10px;transition:.2s}
    .event-item:hover,.chat-item:hover,.friend-item:hover,.pending-item:hover{transform:translateY(-1px);box-shadow:0 12px 22px rgba(15,23,42,.05)}
    .event-item.active,.chat-item.active{border-color:rgba(13,110,253,.35);background:var(--brand-soft)}
    .content-scroll{overflow:auto;max-height:calc(100vh - 230px)}
    .message-wrap{display:flex;flex-direction:column;gap:12px;overflow:auto;height:calc(100vh - 340px);padding-right:4px}
    .message{max-width:72%;padding:12px 14px;border-radius:1rem;background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(15,23,42,.03)}
    .message.me{margin-left:auto;background:linear-gradient(135deg,#0d6efd,#5b8def);color:#fff;border-color:#0d6efd}
    .message .meta{font-size:.78rem;color:inherit;opacity:.72;margin-bottom:.25rem}
    .composer{background:#fff;border-top:1px solid var(--line)}
    .empty{padding:40px 20px;text-align:center;color:var(--muted)}
    .avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#e5eefb}
    .avatar-lg{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#e5eefb}
  </style>
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
<div class="app-wrapper">

        <li class="nav-item d-none d-md-block"><a href="/dashboard/" class="nav-link"><i class="bi bi-grid-1x2 me-1"></i>门 户工作台</a></li>
      </ul>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#" id="topSearchBtn"><i class="bi bi-search"></i></a></li>
        <li class="nav-item dropdown"><a class="nav-link" data-bs-toggle="dropdown" href="#"><i class="bi bi-chat-text"></i><span class="navbar-badge badge text-bg-danger" id="unreadBadge">0</span></a><div class="dropdown-menu dropdown-menu-lg dropdown-menu-end p-2" id="messageDropdown"><div class="dropdown-item text-secondary">暂无新消息</div></div></li>
        <li class="nav-item dropdown"><a class="nav-link" data-bs-toggle="dropdown" href="#"><i class="bi bi-bell-fill"></i><span class="navbar-badge badge text-bg-warning" id="notifyBadge">0</span></a><div class="dropdown-menu dropdown-menu-lg dropdown-menu-end p-2" id="notifyDropdown"><div class="dropdown-item text-secondary">暂无通知</div></div></li>
        <li class="nav-item dropdown user-menu"><a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown"><img id="topAvatar" src="https://via.placeholder.com/160" class="user-image rounded-circle shadow" alt="User Image" /><span class="d-none d-md-inline" id="topUsername">Guest</span></a><ul class="dropdown-menu dropdown-menu-lg dropdown-menu-end"><li class="user-header text-bg-primary"><img id="dropdownAvatar" src="https://via.placeholder.com/160" class="rounded-circle shadow" alt="User Image" /><p><span id="dropdownName">未登录</span><small id="dropdownBio">请先登录</small></p></li><li class="user-footer"><a href="/profile/" class="btn btn-outline-secondary" id="profileBtn">Profile</a><a href="#" class="btn btn-outline-danger float-end" id="logoutBtn">Sign out</a></li></ul></li>
      </ul>
    </div>
  </nav>
  <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
    <div class="sidebar-brand"><a href="/dashboard/" class="brand-link"><img src="/static/avater.jpeg" alt="Logo" class="brand-image opacity-75 shadow" /><span class="brand-text fw-light">星辰协同平台</span></a></div>
    <div class="sidebar-wrapper">
      <nav class="mt-2">
        <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" role="navigation" aria-label="Main navigation" data-accordion="false">
          <li class="nav-header">核心模块</li>
          <li class="nav-item"><a href="/dashboard/" class="nav-link active"><i class="nav-icon bi bi-speedometer2"></i><p>门户工作台</p></a></li>
          <li class="nav-item"><a href="/chat/" class="nav-link"><i class="nav-icon bi bi-chat-dots"></i><p>即时通讯</p></a></li>
          <li class="nav-item"><a href="/friends/" class="nav-link"><i class="nav-icon bi bi-people"></i><p>好友与申请</p></a></li>

  <main class="app-main">
    <div class="app-content-header"><div class="container-fluid"><div class="row align-items-center"><div class="col-sm-6"><h3 class="mb-0">门户工作台</h3><div class="muted">事件中心 / 即时通讯 / 好友与申请 / 个人中心</div></div><div class="col-sm-6"><ol class="breadcrumb float-sm-end"><li class="breadcrumb-item"><a href="/dashboard/">Home</a></li><li class="breadcrumb-item active" aria-current="page">Dashboard</li></ol></div></div></div></div>

</div>
